[couchdb]
single_node = true
max_attachment_size = 4194304

[chttpd]
bind_address = 0.0.0.0
require_valid_user = true

[chttpd_auth]
require_valid_user = true

[disk_monitor]
enable = true
background_view_indexing_threshold = 75
interactive_view_indexing_threshold = 80
interactive_database_writes_threshold = 80

[smoosh]
db_channels = image_safe_dbs
view_channels = image_safe_views

[smoosh.image_safe_dbs]
priority = ratio
min_priority = 2.0
min_size = 16777216
concurrency = 1

[smoosh.image_safe_views]
priority = ratio
min_priority = 2.0
min_size = 16777216
concurrency = 1
